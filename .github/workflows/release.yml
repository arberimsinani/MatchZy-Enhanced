name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  # Second route for an environment that can push branches but cannot
  # dispatch a workflow: a branch named release/patch, release/minor or
  # release/major releases dev with that bump, exactly as the button would.
  # The branch is only the trigger -- the release is cut on dev -- and the
  # job deletes it afterwards so the next push to the same name fires again.
  push:
    branches:
      - 'release/patch'
      - 'release/minor'
      - 'release/major'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve bump
        run: |
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) bump="${{ inputs.bump_type }}" ;;
            push)              bump="${GITHUB_REF_NAME#release/}" ;;
            *) echo "::error::unexpected trigger ${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac
          case "$bump" in
            patch|minor|major) ;;
            *) echo "::error::bump must be patch, minor or major, got '$bump'"; exit 1 ;;
          esac
          echo "BUMP=$bump" >> "$GITHUB_ENV"
          echo "releasing dev with a $bump bump"

      # A branch push checks out dev rather than the trigger branch: release.sh
      # commits the version bump and pushes the branch it is on, and that has to
      # be the branch the release is made from.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'dev' || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: sudo apt-get install -y zip jq

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # release.sh makes the Discord announcement mandatory so a release is
          # never quietly unannounced, and a repository with no webhook secret
          # therefore cannot release at all -- the preflight exits before the
          # version bump. Skip the announcement only when the secret is absent;
          # setting it turns announcements back on with no change here.
          SKIP_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL == '' && '1' || '' }}
        run: echo "y" | bash ./release.sh "${BUMP}"

      - name: Remove the trigger branch
        if: github.event_name == 'push'
        run: git push origin --delete "${GITHUB_REF_NAME}"
